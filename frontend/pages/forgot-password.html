<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password | Staff Rota System</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="auth-subtitle">Verify your identity to reset your password.</p>

    <label for="reset-staff-id">Staff ID</label>
    <input type="number" id="reset-staff-id">

    <label for="reset-dob">Date of Birth</label>
    <input type="date" id="reset-dob">

    <label for="reset-email">Email</label>
    <input type="email" id="reset-email">

    <label for="reset-phone">Phone Number</label>
    <input type="text" id="reset-phone">

    <label for="reset-password">New Password</label>
    <input type="password" id="reset-password">

    <label for="reset-confirm-password">Confirm Password</label>
    <input type="password" id="reset-confirm-password">

    <button onclick="resetPassword()">Reset Password</button>

    <div class="auth-links">
      <a href="index.html">Back to Login</a>
    </div>
  </div>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
