<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Accounts | Staff Rota System</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="container">
  <h2>Pending Staff Accounts</h2>
  <p>Approve or reject new account requests.</p>

  <div id="pending-accounts-list">
    <p>Loading pending accounts...</p>
  </div>

  <p><a href="settings.html">Back to Settings</a></p>
</div>

<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>

<script>
  const staffId = localStorage.getItem("staff_id");
  const isAdmin = localStorage.getItem("is_admin");

  if (!staffId) {
    window.location.href = "index.html";
  } else if (isAdmin !== "1") {
    window.location.href = "homepage.html";
  } else {
    renderBottomNav("settings.html");
    renderModeBanner();
    loadPendingAccounts();
  }
</script>

</body>
</html>
