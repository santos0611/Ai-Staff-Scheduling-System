<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager Calendar | HeartWork</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/manager.css">
</head>

<body>
  <div id="mode-banner"></div>

  <div class="manager-calendar-container">
    <div class="calendar-header">Manager Calendar</div>

    <div class="calendar-body">
      <div class="month-row">
        <h2 id="month-label" class="month-title">Loading...</h2>

        <div class="month-nav">
          <button onclick="changeWeek(-1)">&#8249;</button>
          <button onclick="changeWeek(1)">&#8250;</button>
        </div>
      </div>

      <div id="week-strip" class="week-strip"></div>

      <h3 id="selected-date-label" class="selected-date-heading"></h3>

      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('All', this)">
          All (<span id="count-all">0</span>)
        </button>
        <button class="filter-btn" onclick="setFilter('Absent', this)">
          Absent (<span id="count-absent">0</span>)
        </button>
        <button class="filter-btn" onclick="setFilter('Accepted', this)">
          Accepted (<span id="count-accepted">0</span>)
        </button>
        <button class="filter-btn" onclick="setFilter('Pending', this)">
          Pending (<span id="count-pending">0</span>)
        </button>
      </div>

      <div id="manager-shift-list"></div>
    </div>
  </div>

  <div id="bottom-nav"></div>

  <script src="../js/app.js"></script>
  <script src="../js/manager-calendar.js"></script>

  <script>
    const staffId = localStorage.getItem("staff_id");
    const position = localStorage.getItem("position") || "";
    const isAdmin = localStorage.getItem("is_admin");

    if (!staffId) {
      window.location.href = "index.html";
    } else if (position.toLowerCase() !== "manager" && isAdmin !== "1") {
      window.location.href = "homepage.html";
    } else {
      localStorage.setItem("view_mode", "manager");
      renderBottomNav("manager-calendar.html");
      renderModeBanner();
      initManagerCalendar();
    }
  </script>
</body>
</html>
