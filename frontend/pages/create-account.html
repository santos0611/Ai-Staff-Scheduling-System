<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account | HeartWork</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

<div class="auth-card">
  <h2>Create Account</h2>
  <p class="auth-subtitle">Submit your details for admin approval.</p>

  <form onsubmit="createAccount(event)">
    <label>Full Name</label>
    <input type="text" id="new-name" required>

    <label>Date of Birth</label>
    <input type="date" id="new-dob" required>

    <label>Position</label>
    <select id="new-position" required>
      <option value="crew member">Crew Member</option>
      <option value="crew trainer">Crew Trainer</option>
      <option value="trainee">Trainee</option>
      <option value="manager">Manager</option>
    </select>

    <label>Email</label>
    <input type="email" id="new-email" required>

    <label>Phone</label>
    <input type="text" id="new-phone" required>

    <label>Password</label>
    <input type="password" id="new-password" required oninput="updatePasswordRules('new-password')">
    <div class="password-rules">
      <p>Password must include:</p>
      <ul>
        <li id="rule-length">At least 8 characters</li>
        <li id="rule-uppercase">At least 1 uppercase letter</li>
        <li id="rule-lowercase">At least 1 lowercase letter</li>
        <li id="rule-number">At least 1 number</li>
        <li id="rule-special">At least 1 special character</li>
      </ul>
    </div>

    <label>Confirm Password</label>
    <input type="password" id="new-confirm-password" required>

    <button type="submit">Create Account</button>
  </form>

  <div class="auth-links">
    <a href="index.html">Back to Login</a>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
